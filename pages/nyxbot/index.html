<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyxBot 控制台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark"></span>
      <span>NyxBot 控制台</span>
    </div>
    <div class="status" id="status">就绪</div>
  </header>

  <main>
    <!-- 首页：两个入口 -->
    <section class="home" id="home">
      <p class="lead">选择一个工作区开始。数据来自本地库，渲染在工作台内即时预览。</p>

      <div class="cards">
        <button class="card" data-app="admin">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <ellipse cx="24" cy="11" rx="13" ry="5" />
              <path d="M11 11v11c0 2.8 5.8 5 13 5s13-2.2 13-5V11" />
              <path d="M11 22v11c0 2.8 5.8 5 13 5s13-2.2 13-5V22" />
            </svg>
          </span>
          <span class="card-body">
            <span class="card-title">数据管理台</span>
            <span class="card-desc">查看与维护遗物、市场物品、紫卡、别名等模型数据，支持分页查询、编辑与同步。</span>
          </span>
          <span class="card-go">进入 →</span>
        </button>

        <button class="card" data-app="studio">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <rect x="7" y="9" width="34" height="24" rx="3" />
              <path d="M13 27l6-7 5 6 4-4 7 5" />
              <path d="M16 39h16" />
            </svg>
          </span>
          <span class="card-body">
            <span class="card-title">渲染工作台</span>
            <span class="card-desc">查询遗物、即时预览渲染结果，调整列数、奖励条数、主题与区块开关，并保存版式。</span>
          </span>
          <span class="card-go">进入 →</span>
        </button>
      </div>

      <p class="hint">两个工作区都在本页内运行，互不打断；返回后可继续之前的状态。</p>
    </section>

    <!-- 工作区：内嵌子应用 -->
    <section class="workspace" id="workspace" hidden>
      <div class="ws-bar">
        <button class="back" id="back">← 返回控制台</button>
        <span class="ws-title" id="ws-title"></span>
      </div>
      <div class="frames" id="frames"></div>
    </section>
  </main>

  <script src="./apps.js"></script>
  <script src="./app.js"></script>
</body>
</html>
