<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyxBot 数据管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 侧边栏：模型列表 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>📊 NyxBot</h2>
      <p class="sidebar-subtitle">数据管理中心</p>
    </div>
    <div class="sidebar-search">
      <input
        type="text"
        id="model-filter"
        placeholder="过滤模型..."
        autocomplete="off"
      />
    </div>
    <nav id="model-list">
      <div class="loading-message">加载模型列表中...</div>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <main id="main-content">
    <!-- 顶部工具栏 -->
    <header id="toolbar">
      <div class="toolbar-left">
        <h1 id="current-model-title">选择一个模型</h1>
        <span id="record-count" class="record-count"></span>
      </div>
      <div class="toolbar-right">
        <button id="sync-btn" class="btn btn-secondary" disabled title="从数据源同步">
          🔄 同步
        </button>
        <button id="create-btn" class="btn btn-primary" disabled>
          ➕ 新增记录
        </button>
      </div>
    </header>

    <!-- 数据表格容器 -->
    <div id="table-container">
      <div id="table-placeholder" class="placeholder-message">
        👈 请从左侧选择一个模型开始管理数据
      </div>
    </div>

    <!-- 分页控件 -->
    <footer id="pagination" style="display: none;">
      <button id="prev-page" class="btn btn-page" disabled>上一页</button>
      <span id="page-info"></span>
      <button id="next-page" class="btn btn-page" disabled>下一页</button>
    </footer>
  </main>

  <!-- 编辑/创建模态框 -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">编辑记录</h2>
        <button id="modal-close" class="btn-close">✕</button>
      </div>
      <div class="modal-body">
        <form id="record-form">
          <div id="form-fields"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn btn-secondary">取消</button>
        <button id="modal-submit" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div id="confirm-overlay" class="modal-overlay" style="display: none;">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 id="confirm-title">确认删除</h2>
        <button id="confirm-close" class="btn-close">✕</button>
      </div>
      <div class="modal-body">
        <p id="confirm-message">确定要删除这条记录吗？此操作不可撤销。</p>
        <p id="confirm-detail" class="confirm-detail"></p>
      </div>
      <div class="modal-footer">
        <button id="confirm-cancel" class="btn btn-secondary">取消</button>
        <button id="confirm-delete" class="btn btn-danger">删除</button>
      </div>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="toast" class="toast" style="display: none;"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
