[project]
name = "astrbot-plugin-nyxbot"
version = "1.0.0"
description = "astrbot的warframe助手插件，目标实现与nyxbot功能相同。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 注意：aiohttp / pydantic / Pillow 与 AstrBot Core 共享。
    # AstrBot >= 4.29 会用「Core 已安装版本」作为硬约束安装插件依赖，
    # 因此这里的下限必须 <= Core 允许的最低版本，且不能升级为精确版本，
    # 否则会触发 DependencyConflictError（核心依赖降级保护）。
    # 详细规则见 requirements.txt 顶部说明。
    # Web / Network
    "aiohttp>=3.11.18",
    # Data / Serialization
    "orjson>=3.11.8",
    "pydantic>=2.0.0",
    # Database (Tortoise ORM with SQLite)
    "tortoise-orm>=0.24.0",
    # Image Processing
    "Pillow>=11.0.0",
    # Caching
    "cachetools>=5.5.0",
    # OCR (RapidOCR + onnxruntime / PP-OCRv6)
    # 不要换回 paddlepaddle：其 Linux wheel 编译期硬编码 AVX，无 AVX 的 CPU
    # 上 import 即 SIGILL，进程直接死亡（2026-11-17 线上事故根因）。
    "rapidocr==3.10.0",
    "onnxruntime==1.23.1",
    # Utility
    "pyyaml>=6.0",
    # 搜索索引：中文名称的拼音键（纯 Python，无编译依赖）
    "pypinyin>=0.55.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    # 字体覆盖校验（tests/test_icon_registry.py）
    "fonttools>=4.50.0",
]

[tool.ruff]
# 审查 P2-10：行宽从「未校验」收敛为 120 并启用 E501。
# 120 是实测代码的自然上限（>120 仅 53 处，多为不可拆的 URL/Lotus 路径字面量）；
# 不可拆的长字符串行用 `# noqa: E501` 显式豁免。
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]

# 审查 P2-10 例外：market.py 的超长行几乎全部位于文档串内的 API 响应 JSON
# 示例（URL / 描述等不可拆字符串，无法用行注释豁免），故整文件豁免 E501；
# 其代码部分的超长重试日志行已改为隐式拼接换行。
[tool.ruff.lint.per-file-ignores]
"src/api/market.py" = ["E501"]
